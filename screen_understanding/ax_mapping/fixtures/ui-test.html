<!doctype html><meta charset="utf-8"><title>AX mapping test surface</title>
<style>body{font:17px system-ui;background:#eef2f8;color:#18263b;margin:30px;max-width:1050px}h1{font-size:27px}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}section{background:white;border-radius:14px;padding:24px}label{display:block;margin:16px 0}input,select,button{font:inherit;padding:9px}button{background:#254eda;color:white;border:0;border-radius:7px;margin:8px}button:disabled{background:#999}canvas{background:#f2f6ff;width:100%;height:130px}.hint{color:#58657a}</style>
<h1>Accessibility mapping test surface</h1><p class="hint">Controlled browser fixture: repeated labels, state, nested controls and canvas content.</p>
<main><section aria-label="Editor"><h2>Editor</h2><label>Project name <input value="Perception demo"></label><label><input type="checkbox" checked> Enable autosave</label><label>Theme <select><option>System</option><option>Light</option><option selected>Dark</option></select></label><div><span><button>Save</button></span><button disabled>Delete project</button><button aria-label="Refresh preview">↻</button></div></section>
<section aria-label="Billing"><h2>Billing</h2><label>Reference <input placeholder="Optional reference"></label><div><div><button>Save</button></div></div><p>These two Save buttons belong to different groups.</p><canvas id="plot" width="450" height="130" aria-label="Canvas chart"></canvas><p class="hint">Canvas draws “GPU 72%”; that text has no separate DOM/AX node.</p></section></main>
<script>const c=document.querySelector('canvas').getContext('2d');c.fillStyle='#254eda';c.fillRect(25,55,280,40);c.fillStyle='#18263b';c.font='21px system-ui';c.fillText('GPU 72%',25,35);</script>
